name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Pylint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pylint
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pylint app tests

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest

  image:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" .
          docker tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" "ghcr.io/${{ github.repository }}:latest"

      - name: Smoke test
        run: |
          docker run --detach --name app --publish 127.0.0.1:5000:5000 "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          sleep 3
          curl --fail --silent http://127.0.0.1:5000/health | grep '"status":"ok"'
          docker exec app id | grep uid=999

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository }}:latest"